<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roblox Avatar 3D Viewer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #21262d;
      --text: #e6edf3;
      --muted: #9da7b2;
      --accent: #2f81f7;
      --error: #ff7b72;
      --ok: #3fb950;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #renderContainer {
      width: 100%;
      height: 100%;
    }

    .controls {
      position: absolute;
      left: 50%;
      top: 16px;
      transform: translateX(-50%);
      width: min(95vw, 640px);
      display: flex;
      gap: 8px;
      background: rgba(22, 27, 34, 0.92);
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 10px;
      z-index: 20;
      backdrop-filter: blur(8px);
    }

    input,
    button {
      height: 42px;
      border-radius: 10px;
      border: 1px solid #30363d;
      background: var(--panel-2);
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    input {
      flex: 1;
      padding: 0 12px;
      min-width: 0;
    }

    input:focus {
      border-color: var(--accent);
    }

    button {
      padding: 0 16px;
      cursor: pointer;
      background: var(--accent);
      border-color: transparent;
      font-weight: 600;
      white-space: nowrap;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      width: min(95vw, 640px);
      min-height: 44px;
      background: rgba(22, 27, 34, 0.92);
      border: 1px solid #30363d;
      border-radius: 12px;
      z-index: 20;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .status.error {
      color: var(--error);
    }

    .status.success {
      color: var(--ok);
    }

    .spinner {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(230, 237, 243, 0.2);
      border-top-color: var(--text);
      display: inline-block;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 560px) {
      .controls {
        top: 10px;
        padding: 8px;
      }

      input,
      button {
        height: 40px;
        font-size: 14px;
      }

      button {
        padding: 0 12px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="controls">
      <input id="userIdInput" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Enter Roblox User ID (e.g., 1)" value="1" />
      <button id="loadBtn">Load Avatar</button>
    </div>
    <div id="renderContainer"></div>
    <div id="status" class="status">Enter a Roblox user ID and click <strong style="margin-left:4px">Load Avatar</strong>.</div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.skypack.dev/three';
    import { OrbitControls } from 'https://cdn.skypack.dev/three/addons/controls/OrbitControls.js';
    import { OBJLoader } from 'https://cdn.skypack.dev/three/addons/loaders/OBJLoader.js';
    import { MTLLoader } from 'https://cdn.skypack.dev/three/addons/loaders/MTLLoader.js';

    const renderContainer = document.getElementById('renderContainer');
    const userIdInput = document.getElementById('userIdInput');
    const loadBtn = document.getElementById('loadBtn');
    const statusEl = document.getElementById('status');

    let scene;
    let camera;
    let renderer;
    let controls;
    let currentModel = null;

    initThree();
    animate();

    loadBtn.addEventListener('click', () => loadAvatar(userIdInput.value.trim()));
    userIdInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        loadAvatar(userIdInput.value.trim());
      }
    });

    function getCdnUrl(hash) {
      let i = 31;
      for (let t = 0; t < 38; t++) {
        i ^= hash.charCodeAt(t);
      }
      return `https://t${(i % 8).toString()}.rbxcdn.com/${hash}`;
    }

    function setStatus(message, kind = 'neutral', loading = false) {
      statusEl.className = `status${kind === 'error' ? ' error' : kind === 'success' ? ' success' : ''}`;
      statusEl.innerHTML = `${loading ? '<span class="spinner"></span>' : ''}${message}`;
    }

    function initThree() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0d1117);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 4, 12);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderContainer.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 1.2;
      controls.minDistance = 2;
      controls.maxDistance = 80;

      const ambient = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambient);

      const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
      keyLight.position.set(8, 12, 10);
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
      fillLight.position.set(-8, 4, -10);
      scene.add(fillLight);

      window.addEventListener('resize', onResize);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    async function loadAvatar(userIdRaw) {
      const userId = Number(userIdRaw);
      if (!Number.isInteger(userId) || userId <= 0) {
        setStatus('Please enter a valid numeric Roblox user ID.', 'error');
        return;
      }

      loadBtn.disabled = true;
      setStatus('Fetching thumbnail API metadata...', 'neutral', true);

      try {
        if (currentModel) {
          scene.remove(currentModel);
          disposeObject(currentModel);
          currentModel = null;
        }

        const thumbResponse = await fetch(`https://thumbnails.roblox.com/v1/users/avatar-3d?userId=${userId}`);

        if (thumbResponse.status === 400) {
          throw new Error('Invalid user ID (400). Please check the ID and try again.');
        }
        if (!thumbResponse.ok) {
          throw new Error(`Thumbnails API error (${thumbResponse.status}).`);
        }

        const thumbJson = await thumbResponse.json();
        const entry = thumbJson?.data?.[0];

        if (!entry) {
          throw new Error('No avatar entry returned for this user.');
        }

        if (entry.state === 'Pending') {
          throw new Error('Avatar render is pending. Please wait a moment and retry.');
        }

        if (entry.state !== 'Completed' || !entry.imageUrl) {
          throw new Error(`Avatar state is "${entry.state || 'Unknown'}". Unable to load now.`);
        }

        setStatus('Fetching avatar model metadata...', 'neutral', true);

        const modelResponse = await fetch(entry.imageUrl);
        if (!modelResponse.ok) {
          throw new Error(`Failed to fetch avatar model JSON (${modelResponse.status}).`);
        }

        const modelJson = await modelResponse.json();
        const cameraData = modelJson.camera;
        const aabb = modelJson.aabb;
        const objHash = modelJson?.meshes?.[0];
        const mtlHash = modelJson?.mtls?.[0];
        const textureHashes = modelJson?.textures || [];

        if (!cameraData || !aabb || !objHash || !mtlHash) {
          throw new Error('Model JSON missing required camera/aabb/obj/mtl fields.');
        }

        const objUrl = getCdnUrl(objHash);
        const mtlUrl = getCdnUrl(mtlHash);
        const textureUrls = textureHashes.map(getCdnUrl);

        const center = {
          x: (aabb.min.x + aabb.max.x) / 2,
          y: (aabb.min.y + aabb.max.y) / 2 + 2,
          z: (aabb.min.z + aabb.max.z) / 2
        };

        const camPos = cameraData.position;
        camera.fov = cameraData.fov || 60;
        camera.position.set(camPos.x, camPos.y, camPos.z);
        camera.updateProjectionMatrix();
        controls.target.set(center.x, center.y, center.z);
        controls.update();

        await loadObjWithMtl({ objUrl, mtlUrl, textureUrls });
        setStatus(`Loaded avatar for user ID ${userId}.`, 'success');
      } catch (error) {
        console.error(error);
        setStatus(error.message || 'Unexpected error loading avatar.', 'error');
      } finally {
        loadBtn.disabled = false;
      }
    }

    async function loadObjWithMtl({ objUrl, mtlUrl, textureUrls }) {
      const manager = new THREE.LoadingManager();
      const textureMap = new Map();

      for (const textureUrl of textureUrls) {
        const hash = textureUrl.split('/').pop();
        if (hash) {
          textureMap.set(hash, textureUrl);
        }
      }

      manager.setURLModifier((url) => {
        if (/^https?:\/\//i.test(url) || url.startsWith('data:')) {
          return url;
        }

        const clean = url.replace(/^\.\//, '').split('?')[0];
        const hash = clean.split('/').pop();
        if (hash && textureMap.has(hash)) {
          return textureMap.get(hash);
        }

        if (hash && hash.length >= 32) {
          return getCdnUrl(hash);
        }

        return url;
      });

      const mtlLoader = new MTLLoader(manager);
      const materials = await new Promise((resolve, reject) => {
        mtlLoader.load(mtlUrl, resolve, undefined, reject);
      });

      materials.preload();

      Object.values(materials.materials).forEach((material) => {
        material.transparent = false;
        material.alphaMap = null;
        material.opacity = 1;
        material.depthWrite = true;
        material.needsUpdate = true;
      });

      const objLoader = new OBJLoader(manager);
      objLoader.setMaterials(materials);

      const object = await new Promise((resolve, reject) => {
        objLoader.load(objUrl, resolve, undefined, reject);
      });

      currentModel = object;
      scene.add(object);
    }

    function disposeObject(object) {
      object.traverse((child) => {
        if (child.isMesh) {
          child.geometry?.dispose();

          if (Array.isArray(child.material)) {
            child.material.forEach(disposeMaterial);
          } else {
            disposeMaterial(child.material);
          }
        }
      });
    }

    function disposeMaterial(material) {
      if (!material) return;
      for (const key of Object.keys(material)) {
        const value = material[key];
        if (value && value.isTexture) {
          value.dispose();
        }
      }
      material.dispose?.();
    }
  </script>
</body>
</html>
